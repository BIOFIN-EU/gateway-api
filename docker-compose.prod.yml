services:
  gateway-api:
    image: gateway-api:1.0.0
    build: .
    networks:
      - biofin_network
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    restart: unless-stopped
    command: >
      gunicorn
      -k uvicorn.workers.UvicornWorker
      app.main:app
      --bind 0.0.0.0:8000
      --workers 4
      --timeout 60

networks:
  biofin_network:
    driver: bridge
